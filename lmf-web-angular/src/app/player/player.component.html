<div class="audio-player">
  <div class="d-flex w-100 flex-nowrap">
    <div class="text-nowrap d-flex align-items-center p-1">
      <p-buttonGroup>
        <p-button severity="warning"
          (onClick)="previous()"
          icon="pi pi-angle-left"></p-button>
        <p-button severity="warning"
          (onClick)="isPlaying? pause() : play()"
          icon="pi {{isPlaying ? 'pi-pause':'pi-play'}}"></p-button>
        <p-button severity="warning"
          (onClick)="next()"
          icon="pi pi-angle-right"></p-button>
      </p-buttonGroup>
    </div>
    <div class="p-1">
      <div class="d-flex w-100 flex-nowrap justify-content-between">
        <div class="progress-container">
          <input type="range"
            class="progress-bar"
            [value]="currentTime"
            [max]="duration"
            (input)="onSeek($event)" />
          <div class="time-display">
            <span>{{ formatTime(currentTime) }}</span>
            <span>{{ formatTime(duration) }}</span>
          </div>
        </div>
        <div class="text-nowrap justify-content-center pl-1">
          <i class="star-rated pi pi-star"></i>
          <i class="star-rated pi pi-star"></i>
          <i class="star-rated pi pi-star"></i>
          <i class="star-rated pi pi-star"></i>
        </div>
      </div>
      <div class="d-flex text-nowrap overflow-auto row-caption">
        {{caption}}
      </div>
    </div>
  </div>
</div>
<audio #audioPlayer
  (timeupdate)="updateProgress()"
  (loadedmetadata)="updateMetadata()">
  <source [src]="urlSong"
    type="audio/mpeg" />
  Your browser does not support the audio element.
</audio>

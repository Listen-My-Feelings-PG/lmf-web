<div class="container">
  <h1>Prueba 1</h1>
  <div class="row">
    <div class="col-md-6">
      <table class="table table-dark table-hover table-scroll">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre</th>
            <th scope="col"
              class="rate-col">Puntuación</th>
            <th scope="col">Status</th>
            <th scope="col">Opción</th>
            <th scope="col">Features</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of songs.list; let i=index">
            <td>{{i+1}}</td>
            <td>{{item.name}}</td>
            <td>
              <div *ngIf="(item.status=='local'||item.status=='uploaded'); else scoreDisabled">
                <ng-container *ngFor="let star of rating.stars; let ist = index">
                  <i class="star-rated pi"
                    [ngClass]="item.userScore!==null && ist < item.userScore ? 'pi-star-fill' : 'pi-star'"
                    (click)="rate(i,ist + 1)"></i>
                </ng-container>
              </div>
              <ng-template #scoreDisabled>
                <ng-container *ngFor="let star of rating.stars; let ist = index">
                  <i class="star-disabled pi"
                    [ngClass]="item.userScore!==null && ist < item.userScore ? 'pi-star-fill' : 'pi-star'"></i>
                </ng-container>
              </ng-template>
            </td>
            <td class="text-center">
              <div *ngIf="item.status=='local'">
                <i class="pi pi-spin pi-spinner"
                  style="font-size: 24px"></i>
              </div>
              <div *ngIf="item.status=='uploaded'">
                <i class="pi pi-check"
                  style="font-size: 24px; color: rgb(0, 180, 45);"></i>
              </div>
              <div *ngIf="item.status=='error'">
                <i class="pi pi-exclamation-triangle"
                  style="font-size: 24px; color: red;"></i>
              </div>
            </td>
            <td>
              <button pButton
                type="button"
                size="small"
                [outlined]="true"
                icon="fa-solid fa-circle-play"
                severity="success"
                (click)="play(i)"></button>
            </td>
            <td>
              <div *ngIf="item.tsFeatures=='error'">
                <i class="pi pi-exclamation-triangle"
                  style="font-size: 24px; color: red;"></i>
              </div>
              <div *ngIf="item.tsFeatures===undefined">
                --
              </div>
              <div *ngIf="item.tsFeatures&&item.tsFeatures !== 'error'">
                {{getTsFeaturesDimensions(item)}}
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="mb-3">
        <label for="file">Cargar canción</label>
        <p-fileUpload mode="basic"
          chooseLabel="Choose"
          chooseIcon="pi pi-upload"
          name="file"
          url="https://www.primefaces.org/cdn/api/upload.php"
          accept="audio/mpeg,audio/mpg,audio/mpeg3,audio/mp3,"
          maxFileSize="100000000"
          (onSelect)="onFilesSelected($event)"
          [auto]="true"
          [multiple]="true" />
      </div>
    </div>
    <div class="col-md-6">
      <button pButton
        type="button"
        severity="success"
        (click)="getSongTsFeatures()"
        [disabled]="tsFeatures.poolBusy">
        Obtener características de las canciones calificadas
      </button><br>
      <button pButton
        type="button"
        severity="danger"
        (click)="stopTsFeaturesPool()"
        [disabled]="!tsFeatures.poolBusy">
        Detener extracción
      </button>
    </div>
  </div>
</div>
<app-player class="fixed-player"
  [songUrl]="urlSongPlaying"></app-player>

<div class="container-xxl mb-5">
  <h1>Entrenamiento</h1>
  <div class="row">
    <div class="col-md-3">
      <span *ngIf="playlists.list.length === 0; else notEmpty">(No hay listas de reproducción)</span>
      <ng-template #notEmpty>
        <label>Selecciona una lista de reproducción:</label>
        <p-listbox [options]="playlists.list"
          optionLabel="name"
          [(ngModel)]="playlists.selected" />
      </ng-template>
      <div class="mt-3 text-nowrap">
        <p-buttonGroup>
          <button pButton
            type="button"
            label="Crear lista"
            icon="pi pi-plus"
            severity="success"
            [outlined]="true"
            (click)="setPlaylist(false,'new')"
            size="small"></button>
          <p-fileUpload mode="basic"
            chooseLabel="Cargar canciones"
            chooseIcon="pi pi-plus"
            name="file"
            accept="audio/mpeg,audio/mpg,audio/mpeg3,audio/mp3,"
            maxFileSize="100000000"
            (onSelect)="uploadSongs($event,'train')"
            [auto]="true"
            [multiple]="true"
            [disabled]="songService.busyFlags.songsForUpload"
            url="https://www.primefaces.org/cdn/api/upload.php"
            styleClass="p-fu p-button-outlined p-button-info"
            [style]="{'border-radius':'0px'}" />
          <p-fileUpload mode="basic"
            chooseLabel="Cargar canciones para predecir"
            chooseIcon="pi pi-plus"
            name="file"
            accept="audio/mpeg,audio/mpg,audio/mpeg3,audio/mp3,"
            maxFileSize="100000000"
            (onSelect)="uploadSongs($event,'predict')"
            [auto]="true"
            [multiple]="true"
            styleClass="p-fu p-button-outlined p-button-warning"
            [style]="{'border-radius':'0px'}" />
          <p-button [severity]="'danger'"
            icon="fa-solid fa-hexagon-nodes"
            label="Entrenar canciones faltantes"
            (onClick)="trainModel('all')"
            [disabled]="!playlists.selected || songService.busyFlags.idSongsForFeatures"
            [outlined]="true"></p-button>
        </p-buttonGroup>
      </div>
    </div>
    <div class="col-md">
      <div class="card">
        <p-table [value]="playlists.selected?.songs || []"
          [paginator]="true"
          [paginatorPosition]="'both'"
          [rows]="5"
          [rowsPerPageOptions]="[5,10,100]"
          [styleClass]="'p-datatable-sm'">
          <ng-template pTemplate="header">
            <tr>
              <th>#</th>
              <th>Id</th>
              <th>Nombre</th>
              <th>Tipo</th>
              <th></th>
              <th>Status</th>
              <th>Calificación</th>
              <th>Predicción</th>
              <th>Opciones</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body"
            let-song
            let-i="rowIndex">
            <tr>
              <td [ngClass]="{'text-info':idSongPlaying==song.id}">{{i + 1}}</td>
              <td>{{song.id ? song.id:'--'}}</td>
              <td [ngClass]="{'text-info':idSongPlaying==song.id}">{{song.name}}</td>
              <td><span class="badge text-bg-primary">Archivo MP3</span></td>
              <td>
                <button pButton
                  type="button"
                  size="small"
                  [outlined]="true"
                  icon="fa-solid fa-circle-play"
                  severity="success"
                  (click)="play(i)"></button>
              </td>
              <td class="text-center">
                <span class="badge text-bg-info">{{song.storageStatus+'|'+song.tsStatus+'|'+song.tsInitStatus}}</span>
              </td>
              <td>
                <div *ngIf="song.tsInitStatus=='train'">
                  <ng-container *ngFor="let star of rating.stars; let ist = index">
                    <i class="star-rated pi"
                      [ngClass]="song.userScore !== null && ist < song.userScore! ? 'pi-star-fill' : 'pi-star'"
                      (click)="rate(i,ist + 1)"></i>
                  </ng-container>
                </div>
              </td>
              <td>--</td>
              <td>
                <p-buttonGroup class="text-nowrap">
                  <button pButton
                    type="button"
                    severity="success"
                    [outlined]="true"
                    pTooltip="{{song.tsStatus=='error' ? showTooltipError(song.tsStatusErrReason):''}}"
                    tooltipPosition="top"
                    showDelay="700"
                    [disabled]="!song.userScore||song.tsStatus=='training'||song.tsStatus=='trained'||songService.busyFlags.idSongsForFeatures"
                    (click)="trainModel('single',i)">
                    <i class="fa-solid fa-hexagon-nodes"></i>
                    <span *ngIf="song.tsStatus!==null"
                      class="position-absolute start-79 translate-middle badge-custom rounded-pill"
                      [ngClass]="{'bg-info':song.tsStatus=='training','bg-success':song.tsStatus=='trained','bg-danger':song.tsStatus=='error'}">
                      <i class="pi"
                        [ngClass]="{'pi-spin pi-spinner text-black':song.tsStatus=='training','pi-check':song.tsStatus=='trained','pi-exclamation-triangle':song.tsStatus=='error'}"
                        style="font-size: 1em"></i>
                    </span>
                  </button>
                  <button pButton
                    type="button"
                    severity="info"
                    [outlined]="true">
                    <i class="pi pi-plus"></i>
                  </button>
                  <button pButton
                    type="button"
                    severity="danger"
                    [outlined]="true">
                    <i class="pi pi-trash"></i>
                  </button>
                </p-buttonGroup>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>

<p-dialog header="Nueva lista de reproducción"
  [modal]="true"
  [(visible)]="playlistModal.visible"
  [style]="{ width: '25rem' }">
  <div class="form-group">
    <label for="playlistName">Nombre de la lista de reproducción:</label>
    <input type="text"
      class="form-control"
      id="playlistName"
      [(ngModel)]="playlistModal.name" />
  </div><br>
  <div class="flex justify-content-end gap-2">
    <p-button label="Cancelar"
      severity="secondary"
      (onClick)="playlistModal.visible = false" />
    <p-button label="Guardar"
      (onClick)="setPlaylist(true)" />
  </div>
</p-dialog>

<!-- Playlist Container (DataTables Style) -->
<div class="flex flex-col h-full bg-gray-900 text-gray-100 border-2 border-gray-700 rounded-lg shadow-2xl p-6">

  <!-- Header Section -->
  <div class="mb-6">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center space-x-3">
        <div class="w-16 h-16 bg-gray-950 border-2 border-primary rounded shadow-lg overflow-hidden">
          @if (list.length > 0 && list[0].metadata?.urlAlbumArt) {
          <img [src]="list[0].metadata?.urlAlbumArt"
            alt="Album Art"
            class="w-full h-full object-cover">
          } @else {
          <img src="https://via.placeholder.com/65x65/8278e6/ffffff?text=Album"
            alt="Album Art"
            class="w-full h-full object-cover">
          }
        </div>
        <div>
          <h2 class="text-2xl font-bold text-primary">
            <i class="fas fa-music mr-2"></i>
            {{ currentPlaylist?.name || 'Lista de reproducción' }}
          </h2>
          <p class="text-gray-400 text-sm">
            <span class="font-mono">{{ list.length }}</span> canciones en total
          </p>
        </div>
      </div>
      <div class="flex items-center space-x-4 text-sm text-gray-400">
        <span><i class="fas fa-user mr-1"></i>Various Artists</span>
        <span><i class="fas fa-calendar mr-1"></i>2024</span>
        <span><i class="fas fa-compact-disc mr-1"></i>Rock Collection</span>
        <button [disabled]="true"
          class="ml-4 px-4 py-2 bg-primary hover:bg-opacity-80 text-white font-semibold rounded-lg transition-all duration-200 flex items-center gap-2 shadow-lg hover:shadow-xl">
          <i class="fas fa-plus"></i>
          Agregar canciones a la lista
        </button>
      </div>
    </div>
  </div>

  <!-- DataTable -->
  <div class="flex-1 flex flex-col min-h-0">
    <table #songsTable
      class="display w-full"
      style="width:100%">
      <thead>
        <tr>
          <th class="text-left">#</th>
          <th class="text-left">Título</th>
          <th class="text-left">Artista</th>
          <th class="text-left">Álbum</th>
          <th class="text-center">Rating</th>
          <th class="text-left">Nombre de archivo</th>
        </tr>
      </thead>
      <tbody>
        <!-- DataTables llenará esto automáticamente -->
      </tbody>
    </table>
  </div>
</div>

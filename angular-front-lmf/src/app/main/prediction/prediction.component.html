<div class="flex flex-col h-full bg-gray-900 text-gray-100 border-2 border-gray-700 rounded-lg shadow-2xl p-6 gap-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h2 class="text-3xl font-bold text-primary flex items-center gap-3">
      <i class="fas fa-brain"></i>
      Predicción Personalizada
    </h2>
  </div>

  <!-- Panel de Configuración -->
  <div class="bg-gray-800 border-2 border-gray-700 rounded-lg shadow-lg">

    <!-- Header del Panel con Toggle y Filtros -->
    <div class="flex items-center justify-between p-4 transition-colors">
      <div class="flex items-center gap-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
        <button (click)="setFilter('all')"
          [class]="currentFilter === 'all' ? 'bg-primary text-white shadow-md' : 'text-gray-400 hover:text-white hover:bg-gray-700'"
          class="px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200">
          Todas
        </button>
        <button (click)="setFilter('unrated')"
          [class]="currentFilter === 'unrated' ? 'bg-primary text-white shadow-md' : 'text-gray-400 hover:text-white hover:bg-gray-700'"
          class="px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200">
          Sin Calificación
        </button>
        <button (click)="setFilter('rated')"
          [class]="currentFilter === 'rated' ? 'bg-primary text-white shadow-md' : 'text-gray-400 hover:text-white hover:bg-gray-700'"
          class="px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200">
          Calificadas
        </button>
        <button (click)="setFilter('no-finetune')"
          [class]="currentFilter === 'no-finetune' ? 'bg-primary text-white shadow-md' : 'text-gray-400 hover:text-white hover:bg-gray-700'"
          class="px-4 py-2 text-sm font-semibold rounded-md transition-all duration-200"
          title="Solo canciones que no tienen fine tuning (entrenamiento global <= 1)">
          Sin Fine-Tuning
        </button>
      </div>

      <button [disabled]="listForTraining.list.length === 0 || isAnySelected"
        (click)="startPrediction()"
        class="px-6 py-2 bg-gradient-to-r from-primary via-secondary to-accent hover:opacity-90 text-white font-bold rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fas fa-play-circle"></i>
        Predecir Lista Visible
      </button>
    </div>
  </div>

  <!-- Lista de Canciones -->
  <div class="flex-1 min-h-0">
    <app-list [list]="listForTraining.list"
      (onSelectSong)="playSong($event)"
      [lockRate]="true"
      [predictMode]="true"
      (onPredictSelected)="startPrediction($event)"></app-list>
  </div>

</div>

<div class="flex flex-col h-full bg-gray-900 text-gray-100 border-2 border-gray-700 rounded-lg shadow-2xl p-6 gap-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h2 class="text-3xl font-bold text-primary flex items-center gap-3">
      <i class="fas fa-brain"></i>
      Estadísticas
    </h2>
    <button (click)="loadData()"
      class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-lg transition-colors border border-gray-600 flex items-center gap-2 shadow-md">
      <i class="fas fa-sync-alt"></i>
      Actualizar lista
    </button>
  </div>

  <!-- Lista de Canciones -->
  <div class="flex-1 min-h-0">
    <app-stats-list [list]="songList"
      (onSelectSong)="playSong($event)"></app-stats-list>
  </div>

</div>

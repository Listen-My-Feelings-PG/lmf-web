<!-- Main Container -->
<div class="flex flex-col h-screen bg-gray-900 text-gray-100">

  <!-- Top Toolbar -->
  <header class="bg-gradient-to-r from-gray-800 to-gray-700 border-b-2 border-primary shadow-lg">
    <nav class="flex items-center justify-center space-x-2 p-4">

      <button (click)="navigateTo('training')"
        class="px-6 py-2 bg-secondary text-gray-900 font-bold rounded hover:bg-opacity-80 transition-all duration-200 shadow-md hover:shadow-lg">
        <i class="fas fa-dumbbell mr-2"></i>Training
      </button>
      <button (click)="navigateTo('prediction')"
        class="px-6 py-2 bg-accent text-white font-bold rounded hover:bg-opacity-80 transition-all duration-200 shadow-md hover:shadow-lg">
        <i class="fas fa-magic mr-2"></i>Prediction
      </button>
      <button (click)="navigateTo('stats')"
        class="px-6 py-2 bg-primary text-gray-900 font-bold rounded hover:bg-opacity-80 transition-all duration-200 shadow-md hover:shadow-lg">
        <i class="fas fa-compass mr-2"></i>Stats
      </button>
    </nav>
  </header>

  <!-- Main Content Area with Sidebar -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left Sidebar -->
    <aside class="w-64 bg-gradient-to-b from-gray-800 to-gray-900 border-r-2 border-gray-700 flex flex-col shadow-xl">

      <!-- User Profile Button -->
      <div class="p-4 border-b border-gray-700">
        <button
          class="w-full flex items-center space-x-3 p-3 bg-gradient-to-r from-primary to-accent rounded-lg hover:opacity-80 transition-all duration-200 shadow-lg">
          <div class="w-12 h-12 bg-gray-900 rounded-full flex items-center justify-center border-2 border-white">
            <i class="fas fa-user text-2xl text-primary"></i>
          </div>
          <span class="font-bold text-lg">Mi Perfil</span>
        </button>
      </div>

      <!-- Playlists Section -->
      <div class="flex-1 overflow-y-auto p-4">
        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wide mb-3 flex items-center">
          <i class="fas fa-list-ul mr-2"></i>Mis Playlists
        </h3>
        <ul class="space-y-2">
          <li>
            <button
              class="w-full text-left px-4 py-2 rounded hover:bg-gray-700 transition-all duration-150 flex items-center space-x-2">
              <i class="fas fa-music text-primary"></i>
              <span>Favoritos</span>
            </button>
          </li>
          <li>
            <button
              class="w-full text-left px-4 py-2 rounded hover:bg-gray-700 transition-all duration-150 flex items-center space-x-2">
              <i class="fas fa-music text-secondary"></i>
              <span>Rock Clásico</span>
            </button>
          </li>
          <li>
            <button
              class="w-full text-left px-4 py-2 rounded hover:bg-gray-700 transition-all duration-150 flex items-center space-x-2">
              <i class="fas fa-music text-accent"></i>
              <span>Electrónica</span>
            </button>
          </li>
          <li>
            <button
              class="w-full text-left px-4 py-2 rounded hover:bg-gray-700 transition-all duration-150 flex items-center space-x-2">
              <i class="fas fa-music text-green-custom"></i>
              <span>Chill Vibes</span>
            </button>
          </li>
          <li>
            <button
              class="w-full text-left px-4 py-2 rounded hover:bg-gray-700 transition-all duration-150 flex items-center space-x-2">
              <i class="fas fa-music text-orange-custom"></i>
              <span>Workout Mix</span>
            </button>
          </li>
        </ul>

        <!-- Add Playlist Button -->
        <button
          class="w-full mt-4 px-4 py-2 border-2 border-dashed border-gray-600 rounded hover:border-primary hover:bg-gray-800 transition-all duration-200 flex items-center justify-center space-x-2">
          <i class="fas fa-plus"></i>
          <span>Nueva Playlist</span>
        </button>
      </div>
    </aside>

    <!-- Content Area (empty for now) -->
    <main class="flex-1 overflow-auto p-6 bg-gray-950">
      <!-- Content will go here -->
      <div class="h-full w-full flex flex-col">
        <router-outlet />
      </div>
    </main>
  </div>
  <app-player></app-player>
</div>

<!-- Bottom Player Bar (Winamp Style) -->
<footer class="bg-gradient-to-r from-gray-800 via-gray-700 to-gray-800 border-t-2 border-primary shadow-2xl">
  <div class="p-4">
    <div class="flex items-center justify-between mb-3">

      <!-- Left: Playback Controls -->
      <div class="flex items-center space-x-3">
        <button
          class="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center hover:bg-primary hover:text-gray-900 transition-all duration-200 shadow-md hover:shadow-lg">
          <i class="fas fa-step-backward"></i>
        </button>
        <button
          class="w-12 h-12 bg-gradient-to-br from-primary to-accent rounded-full flex items-center justify-center hover:opacity-80 transition-all duration-200 shadow-lg hover:shadow-xl">
          <i class="fas fa-play text-gray-900"></i>
        </button>
        <button
          class="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center hover:bg-secondary hover:text-gray-900 transition-all duration-200 shadow-md hover:shadow-lg">
          <i class="fas fa-pause"></i>
        </button>
        <button
          class="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center hover:bg-orange-custom hover:text-white transition-all duration-200 shadow-md hover:shadow-lg">
          <i class="fas fa-stop"></i>
        </button>
        <button
          class="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center hover:bg-primary hover:text-gray-900 transition-all duration-200 shadow-md hover:shadow-lg">
          <i class="fas fa-step-forward"></i>
        </button>
      </div>

      <!-- Center: Song Info -->
      <div class="flex-1 mx-8 bg-gray-900 rounded-lg p-3 border border-gray-700 shadow-inner">
        <div class="flex items-center justify-between">
          <div class="flex-1">
            <p class="font-bold text-lg text-primary truncate">Bohemian Rhapsody</p>
            <p class="text-sm text-gray-400 truncate">Queen • A Night at the Opera</p>
          </div>
        </div>
      </div>

      <!-- Right: Rating Stars -->
      <div class="flex items-center space-x-1 bg-gray-900 rounded-lg px-4 py-3 border border-gray-700">
        <span class="text-xs text-gray-400 mr-2">Rating:</span>
        <button class="text-yellow-400 hover:text-yellow-300 transition-colors duration-150">
          <i class="fas fa-star text-xl"></i>
        </button>
        <button class="text-yellow-400 hover:text-yellow-300 transition-colors duration-150">
          <i class="fas fa-star text-xl"></i>
        </button>
        <button class="text-yellow-400 hover:text-yellow-300 transition-colors duration-150">
          <i class="fas fa-star text-xl"></i>
        </button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="flex items-center space-x-4">
      <span class="text-xs text-gray-400 font-mono w-12 text-right">2:45</span>
      <div class="flex-1 h-2 bg-gray-900 rounded-full overflow-hidden shadow-inner border border-gray-700">
        <div class="h-full bg-gradient-to-r from-primary via-secondary to-accent rounded-full shadow-lg"
          style="width: 45%;"></div>
      </div>
      <span class="text-xs text-gray-400 font-mono w-12">5:55</span>
    </div>
  </div>
</footer>
